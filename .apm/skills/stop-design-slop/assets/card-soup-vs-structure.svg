<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><style>text{font-family:Arial,sans-serif;fill:#17202a}.h{font-size:28px;font-weight:700}.s{font-size:17px;fill:#5d6672}.box{fill:#fff;stroke:#d9dde5;stroke-width:2}.line{stroke:#c8cdd5;stroke-width:2}</style><rect width="1200" height="650" fill="#f5f6f8"/><text x="70" y="65" class="h">Card soup</text><text x="650" y="65" class="h">Structural hierarchy</text><text x="70" y="95" class="s">Every relationship becomes a bounded surface.</text><text x="650" y="95" class="s">Use the weakest cue that still communicates the relationship.</text>
<g transform="translate(70 135)"><rect class="box" rx="24" width="470" height="430"/><rect class="box" rx="18" x="28" y="30" width="414" height="105"/><rect class="box" rx="18" x="28" y="155" width="414" height="105"/><rect class="box" rx="18" x="28" y="280" width="414" height="120"/><rect class="box" rx="14" x="245" y="312" width="165" height="55"/><text x="52" y="70" class="h" font-size="20">Section</text><text x="52" y="102" class="s">card within card</text><text x="52" y="195" class="h" font-size="20">Section</text><text x="52" y="227" class="s">same weight again</text><text x="52" y="320" class="h" font-size="20">Section</text><text x="52" y="352" class="s">more container chrome</text></g>
<g transform="translate(650 135)"><text x="0" y="35" class="h" font-size="22">Primary object</text><text x="0" y="68" class="s">Large, unboxed, aligned to a clear reading axis.</text><line x1="0" y1="98" x2="470" y2="98" class="line"/><text x="0" y="145" class="h" font-size="18">Evidence</text><text x="150" y="145" class="s">Grouped by alignment and proximity</text><text x="150" y="180" class="s">No boundary required.</text><line x1="0" y1="215" x2="470" y2="215" class="line"/><text x="0" y="265" class="h" font-size="18">Decision</text><rect x="150" y="238" width="320" height="95" fill="#fff" stroke="#17202a" stroke-width="2"/><text x="170" y="278" class="s">One bounded region because it is</text><text x="170" y="306" class="s">independently actionable.</text><line x1="0" y1="365" x2="470" y2="365" class="line"/><text x="0" y="410" class="s">Typography → proximity → divider → container</text></g></svg>
