<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><style>text{font-family:Arial,sans-serif;fill:#18212b}.h{font-weight:700}.s{fill:#5f6873}.n{font-size:18px;font-weight:700}.b{fill:#f6f7f8;stroke:#cfd4db;stroke-width:2}</style><rect width="1200" height="700" fill="#fff"/><text x="60" y="65" font-size="32" class="h">Stop Design Slop — decision sequence</text><text x="60" y="100" font-size="18" class="s">Design from task and product specificity before visual effects.</text><g transform="translate(80 150)"><rect class="b" width="1040" height="70"/><text x="30" y="43" class="n">1 · Dominant task + primary domain object</text><path d="M520 70v32" stroke="#18212b" stroke-width="3"/><rect class="b" y="102" width="1040" height="70"/><text x="30" y="145" class="n">2 · Governing composition idea</text><path d="M520 172v32" stroke="#18212b" stroke-width="3"/><rect class="b" y="204" width="1040" height="70"/><text x="30" y="247" class="n">3 · Reading order, hierarchy, proximity, alignment</text><path d="M520 274v32" stroke="#18212b" stroke-width="3"/><rect class="b" y="306" width="1040" height="70"/><text x="30" y="349" class="n">4 · Semantic boundaries and interaction regions</text><path d="M520 376v32" stroke="#18212b" stroke-width="3"/><rect class="b" y="408" width="1040" height="70"/><text x="30" y="451" class="n">5 · Brand system + one deliberate decorative motif</text><path d="M520 478v32" stroke="#18212b" stroke-width="3"/><rect x="0" y="510" width="1040" height="70" fill="#18212b"/><text x="30" y="553" fill="#fff" font-family="Arial" font-size="18" font-weight="700">6 · Anti-slop review: remove what has no task, structure, interaction, identity, or comprehension function</text></g></svg>
