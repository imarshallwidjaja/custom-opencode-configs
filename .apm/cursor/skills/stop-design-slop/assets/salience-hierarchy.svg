<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><style>text{font-family:Arial,sans-serif;fill:#17202a}.h{font-weight:700}.s{fill:#606a76}.rule{stroke:#ccd1d9}</style><rect width="1200" height="520" fill="#fff"/><text x="70" y="70" font-size="30" class="h">Visual weight should form a hierarchy, not a plateau</text><text x="70" y="105" font-size="18" class="s">Assign roles before styling: dominant → supporting → quiet → background.</text><g transform="translate(70 155)"><rect width="500" height="260" fill="#f3f4f6"/><rect x="35" y="35" width="260" height="110" fill="#1e2732"/><rect x="320" y="35" width="145" height="65" fill="#9aa2ad"/><rect x="320" y="120" width="145" height="35" fill="#d5d9df"/><rect x="35" y="175" width="430" height="18" fill="#c3c8d0"/><rect x="35" y="210" width="350" height="12" fill="#e2e5e9"/><text x="0" y="295" font-size="18" class="s">Clear hierarchy: unequal scale and contrast</text></g><g transform="translate(650 155)"><rect width="480" height="260" fill="#f3f4f6"/><g fill="#fff" stroke="#bcc2cb" stroke-width="2"><rect x="25" y="30" width="205" height="90" rx="18"/><rect x="250" y="30" width="205" height="90" rx="18"/><rect x="25" y="140" width="205" height="90" rx="18"/><rect x="250" y="140" width="205" height="90" rx="18"/></g><text x="0" y="295" font-size="18" class="s">Salience plateau: every region framed equally</text></g></svg>
